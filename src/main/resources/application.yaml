spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${DB_NAME:wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 10000
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_updates: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:wallet}
    password: ${RABBITMQ_PASSWORD:wallet}
    # Outbox relay marks an event published only after a broker confirm for a routed message.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

wallet:
  currency: IRR
  outbox:
    poll-interval-ms: 100
    batch-size: 100
    confirm-timeout: 5s
  security:
    jwt:
      issuer: wallet-service
      secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
      ttl: 15m

springdoc:
  swagger-ui:
    # Keep the token after a page reload.
    persist-authorization: true
    tags-sorter: alpha